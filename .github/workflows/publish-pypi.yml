name: publish PyPI

on:
  workflow_dispatch:  # allows manual trigger
  push:
    tags:
      - 'v*'
      - '20*.*'
    branches:
      - 'pypi'

jobs:
  build:
    runs-on: ubuntu-24.04
        
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
           python-version: "3.8"
          
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install twine
          
      - name: Pull manylinux2014 image
        run: docker pull quay.io/pypa/manylinux2014_x86_64
        
      - name: Build Cassiopee in a Docker container
        run: |
          docker run --rm -v $GITHUB_WORKSPACE/..:/io \
            quay.io/pypa/manylinux2014_x86_64:latest \
            /bin/bash /io/Cassiopee/tools/buildWheels.sh

      # - name: Publish to Test-PyPI
      #   env:
      #     TWINE_USERNAME: __token__
      #     TWINE_PASSWORD: ${{ secrets.TEST_PYPI_TOKEN }}
      #   run: |
      #     export CASSIOPEE=$GITHUB_WORKSPACE/
      #     ls $CASSIOPEE/wheels/int32/wheelhouse/
      #     for kwheel in $(find $CASSIOPEE/wheels/int32/wheelhouse/ -name '*.whl'); do
      #       twine upload --skip-existing --repository-url https://test.pypi.org/legacy/ --verbose $kwheel;
      #     done
      #     twine upload --skip-existing --repository-url https://test.pypi.org/legacy/ --verbose "$CASSIOPEE"/wheels/int32/meta/*.whl
      #     ls $CASSIOPEE/wheels/int64/wheelhouse/
      #     for kwheel in $(find $CASSIOPEE/wheels/int64/wheelhouse/ -name '*.whl'); do
      #       twine upload --skip-existing --repository-url https://test.pypi.org/legacy/ --verbose $kwheel;
      #     done
      #     twine upload --skip-existing --repository-url https://test.pypi.org/legacy/ --verbose "$CASSIOPEE"/wheels/int64/meta/*.whl

      - name: Publish to PyPI
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_TOKEN }}
        run: |
          export CASSIOPEE=$GITHUB_WORKSPACE
          for kwheel in $(find $CASSIOPEE/wheels/int32/wheelhouse/ -name '*.whl'); do
            twine upload --skip-existing --verbose $kwheel;
          done
          twine upload --skip-existing --verbose "$CASSIOPEE"/wheels/int32/meta/*.whl
          for kwheel in $(find $CASSIOPEE/wheels/int64/wheelhouse/ -name '*.whl'); do
            twine upload --skip-existing --verbose $kwheel;
          done
          twine upload --skip-existing --verbose "$CASSIOPEE"/wheels/int64/meta/*.whl
