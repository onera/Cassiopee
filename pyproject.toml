[build-system]
requires = [
    "setuptools>=61"
]
build-backend = "setuptools.build_meta"

[project]
name = "cassiopee"
version = "4.2"
dependencies = [
  "cassiopee-kcore==4.2",
  "cassiopee-xcore==4.2",
  "cassiopee-converter==4.2",
  "cassiopee-geom==4.2",
  "cassiopee-transform==4.2",
  "cassiopee-generator==4.2",
  "cassiopee-post==4.2",
  "cassiopee-initiator==4.2",
  "cassiopee-connector==4.2",
  "cassiopee-distributor2==4.2",
  "cassiopee-dist2walls==4.2",
  "cassiopee-rigidmotion==4.2",
  "cassiopee-compressor==4.2",
  "cassiopee-modeler==4.2",
  "cassiopee-intersector==4.2",
  "cassiopee-apps==4.2",
  "cassiopee-roms==4.2",
  "cassiopee-cplot==4.2",
  "cassiopee-occ==4.2"
]
requires-python = ">=3.8"
authors = [
  {name = "ONERA"},
  {name = "Francesca Basile"},
  {name = "Clément Benazet"},
  {name = "Christophe Benoit", email = "christophe.benoit@onera.fr"},
  {name = "Luis Bernardos"},
  {name = "Sébastien Bourasseau"},
  {name = "Vincent Casseau", email = "vincent.casseau@onera.fr"},
  {name = "Benjamin Constant", email = "benjamin.constant@onera.fr"},
  {name = "Alexis Dorange"},
  {name = "Imad Hammani"},
  {name = "Gaelle Jeanfaivre"},
  {name = "Guillaume Jeanmasson"},
  {name = "Antoine Jost", email = "antoine.jost@onera.fr"},
  {name = "Xavier Juvigny"},
  {name = "Sâm Landier"},
  {name = "Ivan Mary", email = "ivan.mary@onera.fr"},
  {name = "Bruno Maugars"},
  {name = "Baptiste Méral"},
  {name = "Bertrand Michel"},
  {name = "Francesca Pelerin"},
  {name = "Stéphanie Peron", email = "stephanie.peron@onera.fr"},
  {name = "Pascal Raud"},
  {name = "Thomas Renaud"},
  {name = "Benoit Rodriguez"},
  {name = "Matthieu Soismier"},
  {name = "Alexandre Suss"},
  {name = "Simon Verley"},
  {name = "Christelle Wervaecke"}
]
maintainers = [
  {name = "Christophe Benoit", email = "christophe.benoit@onera.fr"},
  {name = "Vincent Casseau", email = "vincent.casseau@onera.fr"}
]
description = "Computational Fluid Dynamics pre- and post-processing python modules"
readme = "README.md"
license = {text = "LGPLv3"}
#license = "LGPL-3.0-or-later"
#license-files = ["LICENSE"]
keywords = [
  "CAD",
  "CFD",
  "CGNS",
  "Chimera",
  "Immersed Boundary Method",
  "Meshing",
  "Pre-processing",
  "Post-processing"
]

[project.urls]
Homepage = "https://github.com/onera/Cassiopee"
Documentation = "https://onera.github.io/Cassiopee/"
Repository = "https://github.com/onera/Cassiopee.git"
Issues = "https://github.com/onera/Cassiopee/issues"
Changelog = "https://onera.github.io/Cassiopee/current/ReleaseNotes.html"

[tool.setuptools]
packages = []
