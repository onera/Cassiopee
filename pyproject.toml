[build-system]
requires = [
    "setuptools>=61"
]
build-backend = "setuptools.build_meta"

[project]
name = "cassiopee"
version = "2026.11"
dependencies = [
  "cassiopee-kcore==2026.11",
  "cassiopee-xcore==2026.11",
  "cassiopee-converter==2026.11",
  "cassiopee-geom==2026.11",
  "cassiopee-transform==2026.11",
  "cassiopee-generator==2026.11",
  "cassiopee-post==2026.11",
  "cassiopee-initiator==2026.11",
  "cassiopee-connector==2026.11",
  "cassiopee-distributor2==2026.11",
  "cassiopee-dist2walls==2026.11",
  "cassiopee-rigidmotion==2026.11",
  "cassiopee-compressor==2026.11",
  "cassiopee-modeler==2026.11",
  "cassiopee-intersector==2026.11",
  "cassiopee-apps==2026.11",
  "cassiopee-roms==2026.11",
  "cassiopee-cplot==2026.11",
  "cassiopee-occ==2026.11"
]
requires-python = ">=3.8"
authors = [
  {name = "ONERA"}
]
maintainers = [
  {name = "Christophe Benoit", email = "christophe.benoit@onera.fr"},
  {name = "Vincent Casseau", email = "vincent.casseau@onera.fr"}
]
description = "Computational Fluid Dynamics pre- and post-processing python modules"
readme = "README.md"
license = {text = "LGPLv3"}
#license = "LGPL-3.0-or-later"
#license-files = ["LICENSE"]
keywords = [
  "CAD",
  "CFD",
  "CGNS",
  "Chimera",
  "Immersed Boundary Method",
  "Meshing",
  "Pre-processing",
  "Post-processing"
]

[project.urls]
Homepage = "https://github.com/onera/Cassiopee"
Documentation = "https://onera.github.io/Cassiopee/"
Repository = "https://github.com/onera/Cassiopee.git"
Issues = "https://github.com/onera/Cassiopee/issues"
Changelog = "https://onera.github.io/Cassiopee/current/ReleaseNotes.html"

[tool.setuptools]
packages = []
