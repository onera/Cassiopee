[build-system]
requires = [
  "setuptools>=61",
  "scons>=4.4.0",
  "numpy>=2.0",
  "mpi4py>=3.1.3",
  "cassiopee-kcore"
]
build-backend = "setuptools.build_meta"

[project]
name = "cassiopee-cplot"
dynamic = ["version"]
dependencies = [
  "numpy>=1.23.3",
  "mpi4py>=3.1.3"
]
requires-python = ">=3.8"
authors = [
  {name = "ONERA"}
]
maintainers = [
  {name = "Christophe Benoit", email = "christophe.benoit@onera.fr"},
  {name = "Vincent Casseau", email = "vincent.casseau@onera.fr"}
]
description = "Computational Fluid Dynamics pre- and post-processing python modules"
readme = "README.md"
license = {text = "LGPLv3"}
#license = "LGPL-3.0-or-later"
#license-files = ["LICENSE"]
keywords = []
classifiers = [
  "Programming Language :: Python",
  "Operating System :: Unix",
  "Operating System :: Microsoft :: Windows",
  "Topic :: Scientific/Engineering :: Physics"
]

[project.urls]
Homepage = "https://github.com/onera/Cassiopee"
Documentation = "https://onera.github.io/Cassiopee/"
Repository = "https://github.com/onera/Cassiopee.git"
Issues = "https://github.com/onera/Cassiopee/issues"
Changelog = "https://onera.github.io/Cassiopee/current/ReleaseNotes.html"

[project.gui-scripts]
validCassiopee = "CPlot.apps.validCassiopee:main"
cplot = "CPlot.apps.cplot:main"
appCassiopee = "CPlot.apps.tkCassiopee:main"
kcgnsview = "CPlot.apps.tkcgnsview:main"

[tool.setuptools]
package-dir = {"" = "."}
packages = [
  "CPlot",
  "CPlot.apps"
]
script-files = [
  "CPlot/apps/cassiopee"
]

[tool.setuptools.package-data]
CPlot = [
  "buildInfo.json"
]

[tool.setuptools.dynamic]
version = {attr = "CPlot.CPlot.__version__"}
