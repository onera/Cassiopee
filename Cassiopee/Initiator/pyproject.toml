[build-system]
requires = [
  "setuptools>=61",
  "numpy>=1.23.3",
  "scons>=4.4.0"
]
build-backend = "setuptools.build_meta"

[project]
name = "cassiopee-initiator"
dynamic = ["version"]
dependencies = [
#  "setuptools>=61",
#  "numpy>=1.23.3",
#  "mpi4py>=3.1.3",
#  "scons>=4.4.0"
]
requires-python = ">=3.8"
authors = [
  {name = "ONERA"}
]
maintainers = [
  {name = "Christophe Benoit", email = "christophe.benoit@onera.fr"},
  {name = "Vincent Casseau", email = "vincent.casseau@onera.fr"}
]
description = "Computational Fluid Dynamics pre- and post-processing python modules"
readme = "README.md"
license = {text = "LGPLv3"}
#license = "LGPL-3.0-or-later"
#license-files = ["LICENSE"]
keywords = []
classifiers = [
  "Programming Language :: Python",
  "Operating System :: Unix",
  "Operating System :: Microsoft :: Windows",
  "Topic :: Scientific/Engineering :: Physics"
]

[project.urls]
Homepage = "https://github.com/onera/Cassiopee"
Documentation = "https://onera.github.io/Cassiopee/"
Repository = "https://github.com/onera/Cassiopee.git"
Issues = "https://github.com/onera/Cassiopee/issues"
Changelog = "https://onera.github.io/Cassiopee/current/ReleaseNotes.html"

[tool.setuptools]
package-dir = {"" = "."}
packages = ["Initiator"]

[tool.setuptools.dynamic]
version = {attr = "Initiator.Initiator.__version__"}
